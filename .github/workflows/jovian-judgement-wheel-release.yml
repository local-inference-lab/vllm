name: Jovian Judgement CUDA 13.4 vLLM wheels

on:
  push:
    branches:
      - dev/jovian-judgement
    tags:
      - vllm-jovian-cu134-stable-*
    paths:
      - .github/workflows/jovian-judgement-wheel-release.yml
      - cmake/**
      - csrc/**
      - requirements/**
      - rust/**
      - tools/jovian_wheel_release/**
      - vllm/**
      - CMakeLists.txt
      - pyproject.toml
      - rust-toolchain.toml
      - setup.py

permissions:
  contents: write

concurrency:
  group: vllm-jovian-cu134-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-beta:
    if: github.repository == 'local-inference-lab/vllm' && github.ref_type == 'branch'
    runs-on: [self-hosted, linux, x64, lil-wheel-builder]
    # Six hours for the shared-worker lock plus six hours for compilation.
    timeout-minutes: 720
    steps:
      - name: Check out the exact vLLM source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the locked Python command runner
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.11.30

      - name: Build and verify the source-locked wheel
        run: >-
          flock --exclusive --wait 21600
          /var/lib/github-flashinfer/locks/cu134-sm120-build.lock
          tools/jovian_wheel_release/build_bundle.sh

      - name: Publish or verify the immutable beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output=dist/jovian-wheel-release
          tag="vllm-jovian-cu134-beta-${GITHUB_SHA}"
          mkdir built-release
          cp "${output}"/bundle/wheels/*.whl \
            "${output}"/bundle/manifest.json \
            "${output}"/bundle/SHA256SUMS \
            "${output}"/bundle/requirements-github.txt \
            "${output}"/bundle/install.sh \
            "${output}"/bundle/runtime.lock \
            "${output}"/vllm-jovian-cu134-*.tar.zst \
            "${output}"/vllm-jovian-cu134-*.tar.zst.sha256 built-release/
          uv run --no-project --isolated --python 3.12 \
            tools/jovian_wheel_release/verify_release_assets.py \
            --directory built-release \
            --source-commit "${GITHUB_SHA}" --beta-tag "${tag}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            mkdir existing-release
            gh release download "${tag}" --dir existing-release
            uv run --no-project --isolated --python 3.12 \
              tools/jovian_wheel_release/verify_release_assets.py \
              --directory existing-release \
              --source-commit "${GITHUB_SHA}" \
              --beta-tag "${tag}" \
              --reference-directory built-release
            exit 0
          fi
          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Jovian Judgement CUDA 13.4 vLLM beta ${GITHUB_SHA:0:12}" \
            --notes-file "${output}/release-notes.md" \
            "${output}"/bundle/wheels/*.whl \
            "${output}"/bundle/manifest.json \
            "${output}"/bundle/SHA256SUMS \
            "${output}"/bundle/requirements-github.txt \
            "${output}"/bundle/install.sh \
            "${output}"/bundle/runtime.lock \
            "${output}"/vllm-jovian-cu134-*.tar.zst \
            "${output}"/vllm-jovian-cu134-*.tar.zst.sha256

  promote-stable:
    if: github.repository == 'local-inference-lab/vllm' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tagged release verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the locked Python command runner
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.11.30

      - name: Promote the wheel bytes produced for the tagged source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          beta_tag="vllm-jovian-cu134-beta-${GITHUB_SHA}"
          stable_tag="${GITHUB_REF_NAME}"
          mkdir assets
          gh release download "${beta_tag}" --dir assets
          uv run --no-project --isolated --python 3.12 \
            tools/jovian_wheel_release/verify_release_assets.py \
            --directory assets \
            --source-commit "${GITHUB_SHA}" \
            --beta-tag "${beta_tag}"
          if gh release view "${stable_tag}" >/dev/null 2>&1; then
            mkdir existing-stable-release
            gh release download "${stable_tag}" --dir existing-stable-release
            uv run --no-project --isolated --python 3.12 \
              tools/jovian_wheel_release/verify_release_assets.py \
              --directory existing-stable-release \
              --source-commit "${GITHUB_SHA}" \
              --beta-tag "${beta_tag}" \
              --reference-directory assets \
              --promotion
            exit 0
          fi
          mkdir source-beta
          cp assets/* source-beta/
          jq -n \
            --arg status byte-identical-promotion \
            --arg source_release "${beta_tag}" \
            --arg source_commit "${GITHUB_SHA}" \
            --arg source_manifest_sha256 "$(sha256sum assets/manifest.json | awk '{print $1}')" \
            '{schema: "local-inference-vllm-promotion/v1", status: $status,
              source_release: $source_release, source_commit: $source_commit,
              source_manifest_sha256: $source_manifest_sha256,
              invariant: "Wheel bytes are unchanged from the source beta; GPU qualification belongs to the assembled runtime."}' \
            > assets/stable-promotion.json
          uv run --no-project --isolated --python 3.12 \
            tools/jovian_wheel_release/verify_release_assets.py \
            --directory assets --source-commit "${GITHUB_SHA}" \
            --beta-tag "${beta_tag}" --promotion --reference-directory source-beta
          gh release create "${stable_tag}" \
            --target "${GITHUB_SHA}" \
            --title "Jovian Judgement CUDA 13.4 vLLM stable ${GITHUB_SHA:0:12}" \
            --notes "Byte-identical promotion of ${beta_tag}; model-serving qualification belongs to the assembled runtime." \
            assets/*
